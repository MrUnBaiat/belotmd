name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A named image, not ubuntu-latest: when -latest moved to 26.04,
    # setup-python had no 3.9 for it and that leg failed before any test ran.
    # 24.04 has every version in the matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.11'
        with:
          node-version: '20'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Lint the Node bridge
        # `node --check` validates syntax only -- it accepts a name that is
        # used but never declared. That is how a call site once gained an
        # argument the function never took, turning every table search into a
        # ReferenceError and a permanent retry loop.
        if: matrix.python-version == '3.11'
        run: |
          npm ci || npm install
          npm run lint

      - name: Check the SDK imports without the live extra
        run: |
          pip uninstall -y websockets
          python -c "import belotmd; belotmd.BelotState(); print(belotmd.available())"
